# 由 quickfile 包安装。
# 仅监听 8080 服务 quickfile，不干扰 uHTTPd / 用户已有 nginx 配置。
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    access_log off;
    error_log /var/log/nginx/quickfile-error.log warn;

    include /etc/nginx/quickfile-locations/*.locations;
}
