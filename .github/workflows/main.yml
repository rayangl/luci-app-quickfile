name: Build quickfile & Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.arch }} · SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_generic
          - x86_64
        sdk:
          - "25.12"

    steps:
      - uses: actions/checkout@v4

      - name: Cache OpenWrt SDK Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
          key: ow-sdk-${{ matrix.arch }}-sdk${{ matrix.sdk }}-${{ hashFiles('quickfile/Cargo.lock') }}
          restore-keys: |
            ow-sdk-${{ matrix.arch }}-sdk${{ matrix.sdk }}-

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
          FEEDNAME: quickfile
          PACKAGES: quickfile luci-app-quickfile
          NO_REFRESH_CHECK: true
          INDEX: 1

      - name: Collect raw packages
        run: |
          ARCH="${{ matrix.arch }}"
          mkdir -p work/raw

          # IPK
          for f in bin/packages/${ARCH}/quickfile/*.ipk; do
            [ -f "$f" ] || continue
            [[ "$(basename "$f")" == Packages* ]] && continue
            base=$(basename "$f")
            safe="${base//~/.}"
            cp -v "$f" "work/raw/${safe}"
          done

          # APK
          for f in bin/packages/${ARCH}/quickfile/*.apk; do
            [ -f "$f" ] || continue
            [[ "$(basename "$f")" == Packages* ]] && continue
            base=$(basename "$f")
            safe="${base//~/.}"
            cp -v "$f" "work/raw/${safe}"
          done

      - name: Build per-arch .run installer
        run: |
          set -e
          ARCH="${{ matrix.arch }}"
          SDK="${{ matrix.sdk }}"

          QF=$(ls work/raw/quickfile-*-${ARCH}.apk 2>/dev/null | head -1 || true)
          [ -z "$QF" ] && QF=$(ls work/raw/quickfile_*-${ARCH}.ipk 2>/dev/null | head -1 || true)
          if [ -z "$QF" ]; then
            echo "No quickfile package found, skip .run"
            exit 0
          fi

          VER=$(basename "$QF" | sed -E 's/^quickfile[-_]([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "Detected version: $VER"

          PKG_DIR_NAME="${SDK}_quickfile_${VER}_${ARCH}"
          RUN_NAME="${PKG_DIR_NAME}.run"

          rm -rf "bundle/${PKG_DIR_NAME}"
          mkdir -p "bundle/${PKG_DIR_NAME}"

          # 拷贝该架构的包
          cp -v work/raw/quickfile-*-${ARCH}.apk   "bundle/${PKG_DIR_NAME}/" 2>/dev/null || true
          cp -v work/raw/quickfile_*-${ARCH}.ipk   "bundle/${PKG_DIR_NAME}/" 2>/dev/null || true
          cp -v work/raw/luci-app-quickfile-*.apk  "bundle/${PKG_DIR_NAME}/" 2>/dev/null || true
          cp -v work/raw/luci-app-quickfile_*.ipk  "bundle/${PKG_DIR_NAME}/" 2>/dev/null || true
          cp -v work/raw/luci-i18n-quickfile-zh-cn-*.apk "bundle/${PKG_DIR_NAME}/" 2>/dev/null || true
          cp -v work/raw/luci-i18n-quickfile-zh-cn_*.ipk "bundle/${PKG_DIR_NAME}/" 2>/dev/null || true

          # 只拷 install.sh（不再拷 uninstall.sh）
          cp -v scripts/install.sh.template "bundle/${PKG_DIR_NAME}/install.sh"
          chmod +x "bundle/${PKG_DIR_NAME}/install.sh"

          # 打 tar.gz（中间产物）
          tar -czf "work/${PKG_DIR_NAME}.tar.gz" -C bundle "${PKG_DIR_NAME}"

          # 拼接 shell 头 + tar.gz → .run
          mkdir -p dist/run
          cat scripts/run-header.sh.template "work/${PKG_DIR_NAME}.tar.gz" > "dist/run/${RUN_NAME}"
          chmod +x "dist/run/${RUN_NAME}"

          echo "Built: dist/run/${RUN_NAME}"
          ls -lh "dist/run/${RUN_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: run-sdk${{ matrix.sdk }}-${{ matrix.arch }}
          path: dist/run/
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-global
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-runs
          pattern: run-*

      - name: Flatten run files
        run: |
          mkdir -p dist
          find all-runs -type f -name "*.run" -exec cp -v {} dist/ \;

      - name: Determine tag & prerelease
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=v$(date -u +%Y.%m.%d)" >> $GITHUB_OUTPUT
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          ARCHS="aarch64_cortex-a53 aarch64_generic x86_64"
          PREVIOUS_TAG="$(git tag --sort=-creatordate | grep '^v' | grep -vxF "${TAG}" | head -1 || true)"
          [ -n "$PREVIOUS_TAG" ] && RANGE="${PREVIOUS_TAG}..HEAD" || RANGE="HEAD"
          git log --format='%s%x1f%b%x1e' "$RANGE" > commits.raw

          write_section() {
            awk -v title="$1" -v pattern="$2" '
              BEGIN { RS="\036"; FS="\037"; c=0; IGNORECASE=1 }
              {
                sub(/^[[:space:]]+|[[:space:]]+$/, "", $1)
                if ($1=="" || $1 ~ /^Merge /) next
                if ($1 ~ pattern) {
                  item=$1; sub(/^[a-z]+([(][^)]+[)])?!?:[[:space:]]*/, "", item)
                  issue=""; text=$1"\n"$2
                  if (match(text, /((Fixes|Closes|Resolves|Refs)[[:space:]]+#[0-9]+)/)) issue=" ("substr(text,RSTART,RLENGTH)")"
                  else if (match(text, /#[0-9]+/)) issue=" ("substr(text,RSTART,RLENGTH)")"
                  lines[++c]="- "item issue
                }
              }
              END { if(c>0){print "## "title"\n"; for(i=1;i<=c;i++) print lines[i]; print ""} }
            ' commits.raw
          }

          {
            write_section "✨ Features" "^feat"
            write_section "🐛 Bug Fixes" "^fix"
            write_section "🔧 Other" "^(chore|docs|refactor|perf|test|build|ci)"

            echo "## 📦 一键安装包 (.run)"
            echo ""
            echo "**使用方法**：下载对应架构的 \`.run\` 文件，赋予执行权限后直接运行："
            echo ""
            echo '```bash'
            echo "chmod +x <file>.run"
            echo "./<file>.run"
            echo '```'
            echo ""
            echo "脚本会自动安装 nginx、安装 quickfile、配置 8080 端口。"
            echo ""
            echo "**卸载方法**："
            echo ""
            echo '```bash'
            echo "# opkg 系统"
            echo "opkg remove luci-app-quickfile quickfile luci-i18n-quickfile-zh-cn"
            echo ""
            echo "# apk 系统"
            echo "apk del luci-app-quickfile quickfile luci-i18n-quickfile-zh-cn"
            echo '```'
            echo ""
            echo "| 架构 | SDK 25.12 |"
            echo "| :--- | :--- |"
            for arch in $ARCHS; do
              b2=$(ls dist/25.12_quickfile_*_${arch}.run 2>/dev/null | head -1)
              l2=$([ -n "$b2" ] && echo "[下载](${BASE}/$(basename "$b2"))" || echo "—")
              echo "| \`${arch}\` | ${l2} |"
            done
            echo ""
            echo "---"
            echo ""
            echo "> **安全提示**：当前 OpenWrt 源的 nginx 为 1.26.3，"
            echo "> 受 CVE-2026-42945 相似风险影响。**请勿将 8080 端口暴露到公网**，"
            echo "> 建议仅局域网使用。"
            echo ""
            echo "> **Web 后台不受影响**：本安装包只使用 nginx 的 8080 端口，"
            echo "> 不会改动 uHTTPd / LuCI 的 80 端口。"
          } > release_notes.md

          cat release_notes.md

      - name: Replace Existing Manual Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" -R "${{ github.repository }}" --yes --cleanup-tag
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
