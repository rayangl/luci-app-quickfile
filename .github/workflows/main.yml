name: Build quickfile & Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.arch }} · SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_generic
          - x86_64
        sdk:
          - "25.12"
          - "24.10"

    steps:
      - uses: actions/checkout@v4

      - name: Cache OpenWrt SDK Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir/host
          key: ow-sdk-${{ matrix.arch }}-sdk${{ matrix.sdk }}-${{ hashFiles('quickfile/Cargo.lock') }}
          restore-keys: |
            ow-sdk-${{ matrix.arch }}-sdk${{ matrix.sdk }}-

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
          FEEDNAME: quickfile
          PACKAGES: quickfile luci-app-quickfile
          NO_REFRESH_CHECK: true
          INDEX: 1

      - name: Collect packages
        run: |
          ARCH="${{ matrix.arch }}"
          mkdir -p dist/release

          # IPK
          for f in bin/packages/${ARCH}/quickfile/*.ipk; do
            [ -f "$f" ] || continue
            [[ "$(basename "$f")" == Packages* ]] && continue
            base=$(basename "$f" .ipk)
            safe="${base//~/.}"
            cp -v "$f" "dist/release/${safe}-${ARCH}.ipk"
          done

          # APK
          for f in bin/packages/${ARCH}/quickfile/*.apk; do
            [ -f "$f" ] || continue
            [[ "$(basename "$f")" == Packages* ]] && continue
            base=$(basename "$f" .apk)
            safe="${base//~/.}"
            cp -v "$f" "dist/release/${safe}-${ARCH}.apk"
          done

      - name: Build per-arch installer tarball
        run: |
          set -e
          ARCH="${{ matrix.arch }}"
          SDK="${{ matrix.sdk }}"

          QF=$(ls dist/release/quickfile-*-${ARCH}.apk 2>/dev/null | head -1 || true)
          [ -z "$QF" ] && QF=$(ls dist/release/quickfile_*-${ARCH}.ipk 2>/dev/null | head -1 || true)
          if [ -z "$QF" ]; then
            echo "No quickfile package found, skip tarball"
            exit 0
          fi

          VER=$(basename "$QF" | sed -E 's/^quickfile[-_]([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "Detected version: $VER"

          DIRNAME="${SDK}_quickfile_${VER}_${ARCH}"
          rm -rf "bundle/${DIRNAME}"
          mkdir -p "bundle/${DIRNAME}"

          # 拷贝该架构的包
          cp -v dist/release/quickfile-*-${ARCH}.apk   "bundle/${DIRNAME}/" 2>/dev/null || true
          cp -v dist/release/quickfile_*-${ARCH}.ipk   "bundle/${DIRNAME}/" 2>/dev/null || true
          cp -v dist/release/luci-app-quickfile-*.apk  "bundle/${DIRNAME}/" 2>/dev/null || true
          cp -v dist/release/luci-app-quickfile_*.ipk  "bundle/${DIRNAME}/" 2>/dev/null || true
          cp -v dist/release/luci-i18n-quickfile-zh-cn-*.apk "bundle/${DIRNAME}/" 2>/dev/null || true
          cp -v dist/release/luci-i18n-quickfile-zh-cn_*.ipk "bundle/${DIRNAME}/" 2>/dev/null || true

          # 从仓库复制脚本模板（去掉 .template 后缀）
          cp -v scripts/install.sh.template   "bundle/${DIRNAME}/install.sh"
          cp -v scripts/uninstall.sh.template "bundle/${DIRNAME}/uninstall.sh"
          chmod +x "bundle/${DIRNAME}/install.sh" "bundle/${DIRNAME}/uninstall.sh"

          mkdir -p dist/bundles
          tar -czf "dist/bundles/${DIRNAME}.tar.gz" -C bundle "${DIRNAME}"
          echo "Built: dist/bundles/${DIRNAME}.tar.gz"
          tar -tzf "dist/bundles/${DIRNAME}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-sdk${{ matrix.sdk }}-${{ matrix.arch }}
          path: |
            dist/release/
            dist/bundles/
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-global
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: packages-*

      - name: Flatten release files
        run: |
          mkdir -p dist
          find all-artifacts -path "*/release/*" -type f -exec cp -v {} dist/ \;
          find all-artifacts -path "*/bundles/*" -type f -exec cp -v {} dist/ \;

      - name: Determine tag & prerelease
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=v$(date -u +%Y.%m.%d)" >> $GITHUB_OUTPUT
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          ARCHS="aarch64_cortex-a53 aarch64_generic x86_64"
          PREVIOUS_TAG="$(git tag --sort=-creatordate | grep '^v' | grep -vxF "${TAG}" | head -1 || true)"
          [ -n "$PREVIOUS_TAG" ] && RANGE="${PREVIOUS_TAG}..HEAD" || RANGE="HEAD"
          git log --format='%s%x1f%b%x1e' "$RANGE" > commits.raw

          write_section() {
            awk -v title="$1" -v pattern="$2" '
              BEGIN { RS="\036"; FS="\037"; c=0; IGNORECASE=1 }
              {
                sub(/^[[:space:]]+|[[:space:]]+$/, "", $1)
                if ($1=="" || $1 ~ /^Merge /) next
                if ($1 ~ pattern) {
                  item=$1; sub(/^[a-z]+([(][^)]+[)])?!?:[[:space:]]*/, "", item)
                  issue=""; text=$1"\n"$2
                  if (match(text, /((Fixes|Closes|Resolves|Refs)[[:space:]]+#[0-9]+)/)) issue=" ("substr(text,RSTART,RLENGTH)")"
                  else if (match(text, /#[0-9]+/)) issue=" ("substr(text,RSTART,RLENGTH)")"
                  lines[++c]="- "item issue
                }
              }
              END { if(c>0){print "## "title"\n"; for(i=1;i<=c;i++) print lines[i]; print ""} }
            ' commits.raw
          }

          {
            write_section "✨ Features" "^feat"
            write_section "🐛 Bug Fixes" "^fix"
            write_section "🔧 Other" "^(chore|docs|refactor|perf|test|build|ci)"

            # 一键安装包
            echo "## 📦 一键安装包（推荐）"
            echo ""
            echo "解压后执行 \`sh install.sh\` 即可，自动安装 nginx、配置 8080 端口。"
            echo "卸载执行 \`sh uninstall.sh\`，不会影响 uHTTPd / LuCI 后台。"
            echo ""
            echo "| 架构 | SDK 24.10 | SDK 25.12 |"
            echo "| :--- | :--- | :--- |"
            for arch in $ARCHS; do
              b1=$(ls dist/24.10_quickfile_*_${arch}.tar.gz 2>/dev/null | head -1)
              b2=$(ls dist/25.12_quickfile_*_${arch}.tar.gz 2>/dev/null | head -1)
              l1=$([ -n "$b1" ] && echo "[下载](${BASE}/$(basename "$b1"))" || echo "—")
              l2=$([ -n "$b2" ] && echo "[下载](${BASE}/$(basename "$b2"))" || echo "—")
              echo "| \`${arch}\` | ${l1} | ${l2} |"
            done
            echo ""

            # SDK 24.10 IPK
            echo "## 📦 SDK 24.10 · (IPK)"
            echo ""
            echo "### 主程序（按架构）"
            echo ""
            echo "| 架构 | quickfile |"
            echo "| :--- | :--- |"
            for arch in $ARCHS; do
              f=$(ls dist/quickfile_*-${arch}.ipk 2>/dev/null | head -1)
              link=$([ -n "$f" ] && echo "[$(basename "$f")](${BASE}/$(basename "$f"))" || echo "—")
              echo "| \`${arch}\` | ${link} |"
            done
            echo ""
            echo "### LuCI 前端与语言包（all 架构，通用）"
            echo ""
            luci_ipk=$(ls dist/luci-app-quickfile_*.ipk 2>/dev/null | head -1)
            [ -n "$luci_ipk" ] && echo "- [$(basename "$luci_ipk")](${BASE}/$(basename "$luci_ipk"))"
            i18n_ipk=$(ls dist/luci-i18n-quickfile-zh-cn_*.ipk 2>/dev/null | head -1)
            [ -n "$i18n_ipk" ] && echo "- [$(basename "$i18n_ipk")](${BASE}/$(basename "$i18n_ipk"))"
            echo ""

            # SDK 25.12 APK
            echo "## 📦 SDK 25.12 · (APK)"
            echo ""
            echo "### 主程序（按架构）"
            echo ""
            echo "| 架构 | quickfile |"
            echo "| :--- | :--- |"
            for arch in $ARCHS; do
              f=$(ls dist/quickfile-*-${arch}.apk 2>/dev/null | head -1)
              link=$([ -n "$f" ] && echo "[$(basename "$f")](${BASE}/$(basename "$f"))" || echo "—")
              echo "| \`${arch}\` | ${link} |"
            done
            echo ""
            echo "### LuCI 前端与语言包（按架构）"
            echo ""
            for arch in $ARCHS; do
              fl=$(ls dist/luci-app-quickfile-*-${arch}.apk 2>/dev/null | head -1)
              f_i18n=$(ls dist/luci-i18n-quickfile-zh-cn-*-${arch}.apk 2>/dev/null | head -1)
              ll=$([ -n "$fl" ] && echo "[$(basename "$fl")](${BASE}/$(basename "$fl"))" || echo "—")
              li=$([ -n "$f_i18n" ] && echo "[$(basename "$f_i18n")](${BASE}/$(basename "$f_i18n"))" || echo "—")
              echo "- \`${arch}\`: luci=${ll}  i18n=${li}"
            done
            echo ""

            echo "---"
            echo ""
            echo "> **安全提示**：当前 OpenWrt 源的 nginx 为 1.26.3，"
            echo "> 受 CVE-2026-42945 相似风险影响。**请勿将 8080 端口暴露到公网**，"
            echo "> 建议仅局域网使用。"
          } > release_notes.md

          cat release_notes.md

      - name: Replace Existing Manual Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" -R "${{ github.repository }}" --yes --cleanup-tag
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
