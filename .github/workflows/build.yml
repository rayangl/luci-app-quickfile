name: Build Quickfile (Single APK)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target Architecture'
        required: true
        default: 'aarch64_generic'
        type: choice
        options:
          - aarch64_cortex-a53
          - aarch64_generic

jobs:
  build:
    name: Build ${{ github.event.inputs.arch }}
    runs-on: ubuntu-latest
    # 保留超时保护，防止假死
    timeout-minutes: 120 
    
    steps:
      - uses: actions/checkout@v4

      # 缓存机制保留，加速编译
      - name: Cache OpenWrt SDK Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
            openwrt/build_dir
          key: ow-sdk-${{ github.event.inputs.arch }}-${{ hashFiles('quickfile/Makefile') }}
          restore-keys: |
            ow-sdk-${{ github.event.inputs.arch }}-

      # 使用 gh-action-sdk 自动处理 Target 映射
      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ github.event.inputs.arch }}-openwrt-25.12
          FEEDNAME: quickfile
          PACKAGES: quickfile luci-app-quickfile
          NO_REFRESH_CHECK: true
          INDEX: 1
          # 开启详细日志
          V: s

      - name: Collect APK packages
        env:
          TARGET_ARCH: ${{ github.event.inputs.arch }}
        run: |
          mkdir -p work/raw
          # gh-action-sdk 默认把产物放在 bin/packages/架构名/quickfile/
          ARCH_DIR="${{ github.event.inputs.arch }}"
          
          # 查找所有 .apk 并拷贝
          find bin/packages -type f -name "*.apk" -exec cp -v {} work/raw/ \;
          
          echo "收集到的 APK 文件:"
          ls -lh work/raw/

      - name: Build .run installer (APK only)
        env:
          TARGET_ARCH: ${{ github.event.inputs.arch }}
        run: |
          set -e
          SDK="25.12"
          
          QF=$(ls work/raw/quickfile-*.apk 2>/dev/null | head -1 || true)
          if [ -z "$QF" ]; then
            echo "Error: No quickfile APK found!"
            exit 1
          fi

          VER=$(basename "$QF" | sed -E 's/^quickfile[-_]([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          PKG_DIR_NAME="${SDK}_quickfile_${VER}_${TARGET_ARCH}"
          RUN_NAME="${PKG_DIR_NAME}.run"

          rm -rf "bundle/${PKG_DIR_NAME}"
          mkdir -p "bundle/${PKG_DIR_NAME}"
          
          # 仅拷贝 APK
          cp -v work/raw/*.apk "bundle/${PKG_DIR_NAME}/"
          
          # 拷贝并设置安装脚本
          cp -v scripts/install.sh.template "bundle/${PKG_DIR_NAME}/install.sh"
          chmod +x "bundle/${PKG_DIR_NAME}/install.sh"

          # 生成 .run
          tar -czf "work/${PKG_DIR_NAME}.tar.gz" -C bundle "${PKG_DIR_NAME}"
          mkdir -p dist/run
          cat scripts/run-header.sh.template "work/${PKG_DIR_NAME}.tar.gz" > "dist/run/${RUN_NAME}"
          chmod +x "dist/run/${RUN_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.event.inputs.arch }}
          path: dist/run/
