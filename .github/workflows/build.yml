name: Build Quickfile (Native Docker)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target Architecture'
        required: true
        default: 'aarch64_generic'
        type: choice
        options:
          - aarch64_cortex-a53
          - aarch64_generic

jobs:
  build:
    name: Build ${{ github.event.inputs.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 120 
    
    steps:
      - uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          mkdir -p openwrt
          chmod -R +x scripts/ || true

      # 使用官方原生 Docker 编译，日志完全实时可见
      - name: Build with OpenWrt SDK Docker
        env:
          TARGET_ARCH: ${{ github.event.inputs.arch }}
        run: |
          echo "正在准备编译环境..."
          
          # 既然是 aarch64_generic，我们使用官方的 armsr/armv8 (ARM SystemReady) SDK，兼容性最好
          if [ "$TARGET_ARCH" = "aarch64_generic" ]; then
            SDK_IMAGE="ghcr.io/openwrt/sdk:armsr-armv8-25.12"
          else
            # 如果是 cortex-a53，常用的是 mediatek/filogic 或 rockchip/armv8，这里以通用的 armsr 代替，或者你可以根据实际设备修改
            SDK_IMAGE="ghcr.io/openwrt/sdk:armsr-armv8-25.12"
          fi

          docker pull $SDK_IMAGE
          
          # 运行编译容器
          docker run --rm -v "$(pwd)":/work -w /work \
            $SDK_IMAGE \
            /bin/bash -c '
              set -e
              echo "=> 克隆源码到 package 目录..."
              git clone https://github.com/${GITHUB_REPOSITORY}.git package/quickfile
              
              echo "=> 更新 feeds..."
              ./scripts/feeds update -a
              ./scripts/feeds install -a
              
              echo "=> 生成默认配置..."
              make defconfig
              
              echo "=> 开始编译 quickfile (V=s)..."
              make package/quickfile/quickfile/compile V=s -j$(nproc)
              
              echo "=> 开始编译 luci-app-quickfile (V=s)..."
              make package/quickfile/luci-app-quickfile/compile V=s -j$(nproc)
            '

      - name: Collect APK packages
        run: |
          mkdir -p work/raw
          # 在 Docker 编译后，产物会生成在 openwrt/bin 下
          find openwrt/bin -type f -name "*.apk" -exec cp -v {} work/raw/ \; || true
          # 如果 25.12 还没完全切换到 apk，兼容一下 ipk
          find openwrt/bin -type f -name "*.ipk" -exec cp -v {} work/raw/ \; || true
          
          echo "收集到的文件:"
          ls -lh work/raw/

      - name: Build .run installer
        env:
          TARGET_ARCH: ${{ github.event.inputs.arch }}
        run: |
          set -e
          SDK="25.12"
          
          # 优先找 apk，没有再找 ipk
          QF=$(ls work/raw/quickfile-*.apk 2>/dev/null | head -1 || true)
          [ -z "$QF" ] && QF=$(ls work/raw/quickfile_*.ipk 2>/dev/null | head -1 || true)
          
          if [ -z "$QF" ]; then
            echo "Error: No quickfile package found!"
            exit 1
          fi

          VER=$(basename "$QF" | sed -E 's/^quickfile[-_]([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          PKG_DIR_NAME="${SDK}_quickfile_${VER}_${TARGET_ARCH}"
          RUN_NAME="${PKG_DIR_NAME}.run"

          rm -rf "bundle/${PKG_DIR_NAME}"
          mkdir -p "bundle/${PKG_DIR_NAME}"
          
          cp -v work/raw/*.apk "bundle/${PKG_DIR_NAME}/" 2>/dev/null || true
          cp -v work/raw/*.ipk "bundle/${PKG_DIR_NAME}/" 2>/dev/null || true
          
          cp -v scripts/install.sh.template "bundle/${PKG_DIR_NAME}/install.sh"
          chmod +x "bundle/${PKG_DIR_NAME}/install.sh"

          tar -czf "work/${PKG_DIR_NAME}.tar.gz" -C bundle "${PKG_DIR_NAME}"
          mkdir -p dist/run
          cat scripts/run-header.sh.template "work/${PKG_DIR_NAME}.tar.gz" > "dist/run/${RUN_NAME}"
          chmod +x "dist/run/${RUN_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.event.inputs.arch }}
          path: dist/run/
