name: Build Quickfile (SDK Native)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target Architecture'
        required: true
        default: 'aarch64_generic'
        type: choice
        options:
          - aarch64_cortex-a53
          - aarch64_generic

jobs:
  build:
    name: Build ${{ github.event.inputs.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 120 
    
    steps:
      - uses: actions/checkout@v4

      - name: Download & Extract SDK
        env:
          TARGET_ARCH: ${{ github.event.inputs.arch }}
        run: |
          echo "正在准备下载 OpenWrt 25.12 SDK..."
          mkdir -p sdk_root
          
          # 使用 OpenWrt 官方 snapshots 仓库的 25.12 SDK (对应 iStoreOS 25.12 的底层)
          # 注意：如果这个具体的版本号过期了，你可以去 https://downloads.openwrt.org/snapshots/targets/armsr/armv8/ 找一个最新的 SDK 链接替换
          SDK_FILE="openwrt-sdk-25.12.0-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          SDK_URL="https://downloads.openwrt.org/releases/25.12.0-rc1/targets/armsr/armv8/${SDK_FILE}"
          
          echo "正在下载: $SDK_URL"
          # 使用 wget 下载，你可以实时看到下载进度
          wget -q --show-progress "$SDK_URL" -O sdk.tar.zst || { echo "下载失败，尝试备用链接..."; exit 1; }
          
          echo "正在解压 SDK..."
          tar -I zstd -xf sdk.tar.zst -C sdk_root --strip-components=1
          rm sdk.tar.zst
          
          echo "SDK 准备完毕。"
          ls -la sdk_root/

      - name: Compile Quickfile
        run: |
          cd sdk_root
          set -e
          
          echo "=> 克隆源码到 package 目录..."
          git clone https://github.com/${GITHUB_REPOSITORY}.git package/quickfile
          
          echo "=> 更新 feeds..."
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          echo "=> 生成默认配置..."
          make defconfig
          
          echo "=> 开始编译 quickfile (V=s)..."
          make package/quickfile/quickfile/compile V=s -j$(nproc)
          
          echo "=> 开始编译 luci-app-quickfile (V=s)..."
          make package/quickfile/luci-app-quickfile/compile V=s -j$(nproc)

      - name: Collect APK packages
        run: |
          mkdir -p work/raw
          # 收集编译产生的 .apk (25.12 默认格式)
          find sdk_root/bin -type f -name "*.apk" -exec cp -v {} work/raw/ \; || true
          echo "收集到的文件:"
          ls -lh work/raw/

      - name: Build .run installer
        env:
          TARGET_ARCH: ${{ github.event.inputs.arch }}
        run: |
          set -e
          SDK="25.12"
          
          # 寻找 APK
          QF=$(ls work/raw/quickfile-*.apk 2>/dev/null | head -1 || true)
          if [ -z "$QF" ]; then
            echo "Error: No quickfile APK found!"
            exit 1
          fi

          VER=$(basename "$QF" | sed -E 's/^quickfile[-_]([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          PKG_DIR_NAME="${SDK}_quickfile_${VER}_${TARGET_ARCH}"
          RUN_NAME="${PKG_DIR_NAME}.run"

          rm -rf "bundle/${PKG_DIR_NAME}"
          mkdir -p "bundle/${PKG_DIR_NAME}"
          
          # 仅拷贝 APK
          cp -v work/raw/*.apk "bundle/${PKG_DIR_NAME}/"
          
          # 你的安装脚本
          cp -v scripts/install.sh.template "bundle/${PKG_DIR_NAME}/install.sh"
          chmod +x "bundle/${PKG_DIR_NAME}/install.sh"

          # 打包
          tar -czf "work/${PKG_DIR_NAME}.tar.gz" -C bundle "${PKG_DIR_NAME}"
          mkdir -p dist/run
          cat scripts/run-header.sh.template "work/${PKG_DIR_NAME}.tar.gz" > "dist/run/${RUN_NAME}"
          chmod +x "dist/run/${RUN_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.event.inputs.arch }}
          path: dist/run/
