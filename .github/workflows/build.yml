name: Build Quickfile (OpenWrt 25.12)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target Architecture'
        required: true
        default: 'aarch64_generic'
        type: choice
        options:
          - aarch64_cortex-a53
          - aarch64_generic

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai
  PLUGIN_DIR: package/quickfile

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          overprovision-lvm: 'true'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -qq update -y
          sudo -E apt -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd -y
          sudo timedatectl set-timezone "$TZ"

      - name: Restore OpenWrt cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt
          key: quickfile-openwrt-25.12-${{ runner.os }}
          restore-keys: |
            quickfile-openwrt-25.12-

      - name: Clone OpenWrt source
        if: steps.cache.outputs.cache-hit != 'true'
        run: git clone https://github.com/openwrt/openwrt.git -b openwrt-25.12 --depth 1 openwrt

      - name: Update and Install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration & Clone Plugin
        env:
          TARGET_ARCH: ${{ github.event.inputs.arch }}
        run: |
          cd openwrt
          rm -f .config
          
          echo "=> 克隆 quickfile 源码..."
          rm -rf ${{ env.PLUGIN_DIR }}
          git clone https://github.com/${{ github.repository }}.git ${{ env.PLUGIN_DIR }}
          
          echo "=> 生成 .config 配置..."
          echo "CONFIG_TARGET_armsr=y" >> .config
          echo "CONFIG_TARGET_armsr_armv8=y" >> .config
          
          echo "CONFIG_PACKAGE_quickfile=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-quickfile=m" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-quickfile-zh-cn=m" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_SIGN_EACH_PACKAGE=n" >> .config

      - name: Download and Compile
        run: |
          cd openwrt
          echo "=> 生成 defconfig..."
          make defconfig
          
          echo "=> 预下载依赖包..."
          make download -j8 || true
          
          echo "=> 开始精准编译 quickfile (仅编译所需模块)..."
          make package/quickfile/quickfile/compile -j$(nproc) || make package/quickfile/quickfile/compile -j1 V=s
          make package/quickfile/luci-app-quickfile/compile -j$(nproc) || make package/quickfile/luci-app-quickfile/compile -j1 V=s

      - name: Save OpenWrt cache
        uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: openwrt
          key: quickfile-openwrt-25.12-${{ runner.os }}

      - name: Collect APK packages
        run: |
          mkdir -p work/raw
          find openwrt/bin/packages -type f -name "*.apk" -exec cp -v {} work/raw/ \; || true
          echo "收集到的 APK 文件:"
          ls -lh work/raw/

      - name: Build .run installer (APK only)
        env:
          TARGET_ARCH: ${{ github.event.inputs.arch }}
        run: |
          set -e
          SDK="25.12"
          
          QF=$(ls work/raw/quickfile-*.apk 2>/dev/null | head -1 || true)
          if [ -z "$QF" ]; then
            echo "Error: No quickfile APK found!"
            exit 1
          fi

          VER=$(basename "$QF" | sed -E 's/^quickfile[-_]([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          # 把版本号输出到环境变量，供后面的 Release 步骤使用
          echo "PKG_VERSION=${VER}" >> $GITHUB_ENV
          
          PKG_DIR_NAME="${SDK}_quickfile_${VER}_${TARGET_ARCH}"
          RUN_NAME="${PKG_DIR_NAME}.run"

          rm -rf "bundle/${PKG_DIR_NAME}"
          mkdir -p "bundle/${PKG_DIR_NAME}"
          
          echo "=> 拷贝所有编译出的 APK 到安装包中..."
          cp -v work/raw/*.apk "bundle/${PKG_DIR_NAME}/"

          echo "=> 打包并生成 .run 文件..."
          tar -czf "work/${PKG_DIR_NAME}.tar.gz" -C bundle "${PKG_DIR_NAME}"
          mkdir -p dist/run
          
          # 生成标准的自解压脚本
          cat > dist/run/${RUN_NAME} << 'RUNEOF'
#!/bin/sh
# 自解压安装脚本
ARCHIVE_LINE=$(awk '/^__ARCHIVE_BELOW__/ {print NR + 1; exit 0; }' "$0")
tail -n +$ARCHIVE_LINE "$0" | tar -xz -C /tmp
echo "正在安装所有依赖包..."
cd /tmp/__PKG_DIR__
apk add --allow-untrusted *.apk
echo "安装完成！"
exit 0
__ARCHIVE_BELOW__
RUNEOF
          
          # 动态替换脚本里的文件夹名
          sed -i "s/__PKG_DIR__/${PKG_DIR_NAME}/g" "dist/run/${RUN_NAME}"
          
          # 将 tar.gz 的二进制内容拼接到脚本末尾
          cat "work/${PKG_DIR_NAME}.tar.gz" >> "dist/run/${RUN_NAME}"
          chmod +x "dist/run/${RUN_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.event.inputs.arch }}
          path: dist/run/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          # 使用提取出来的真实版本号，加上架构，避免冲突
          tag_name: v${{ env.PKG_VERSION }}-${{ github.event.inputs.arch }}
          name: Quickfile v${{ env.PKG_VERSION }} (${{ github.event.inputs.arch }})
          draft: false
          prerelease: true
          files: dist/run/*.run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
